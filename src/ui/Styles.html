<style>
:root {
  --text: #111;
  --muted: #666;
  --border: #e5e5e5;
  --panel: #fafafa;
  --accent: #1a5fb4;
  --red: #b4231a;
  --amber: #a86400;
  --green: #1a7f37;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  color: var(--text);
  background: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 13px;
  line-height: 1.45;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ------------------------------------------------------------- app shell */

#app { display: flex; min-height: 100vh; min-width: 1000px; }

#sidebar {
  width: 200px;
  flex: 0 0 200px;
  border-right: 1px solid var(--border);
  background: var(--panel);
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 14px 0;
}

#sidebar .brand {
  font-weight: 600;
  font-size: 14px;
  padding: 0 14px 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
#sidebar .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }

#sidebar nav a {
  display: block;
  padding: 6px 14px;
  color: var(--text);
  border-left: 2px solid transparent;
}
#sidebar nav a:hover { background: #f0f0f0; text-decoration: none; }
#sidebar nav a.active { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }

#sidebar .who {
  position: absolute;
  bottom: 12px;
  left: 14px;
  right: 14px;
  font-size: 11px;
  color: var(--muted);
  border-top: 1px solid var(--border);
  padding-top: 8px;
  word-break: break-all;
}

#main { flex: 1 1 auto; padding: 16px 20px 60px; min-width: 0; }

h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
h3 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 14px; }

.pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
.pagehead .actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- basics */

button, .btn {
  font: inherit;
  border: 1px solid #ccc;
  background: #fff;
  color: var(--text);
  border-radius: 4px;
  padding: 5px 10px;
  cursor: pointer;
  transition: background 100ms linear;
}
button:hover, .btn:hover { background: #f2f2f2; text-decoration: none; }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover, .btn.primary:hover { background: #17539c; }
button.danger { border-color: var(--red); color: var(--red); }
button:disabled { opacity: .55; cursor: default; }
button.link { border: none; background: none; color: var(--accent); padding: 0; }
button.small { padding: 2px 7px; font-size: 12px; }

input, select, textarea {
  font: inherit;
  border: 1px solid #ccc;
  border-radius: 4px;
  padding: 4px 6px;
  background: #fff;
  color: var(--text);
  width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid #cfe0f5; border-color: var(--accent); }
textarea { min-height: 54px; resize: vertical; }
label.f { display: block; margin-bottom: 8px; }
label.f > span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
label.f.req > span::after { content: ' *'; color: var(--red); }

.card { border: 1px solid var(--border); border-radius: 4px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.panel { border: 1px solid var(--border); border-radius: 4px; background: #fff; padding: 12px; }
.panel + .panel { margin-top: 12px; }
.panel h2 { border-bottom: 1px solid var(--border); padding-bottom: 6px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1 1 auto; }
.muted { color: var(--muted); }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.mono { font-family: Consolas, "Courier New", monospace; }
.mt8 { margin-top: 8px; }
.mt12 { margin-top: 12px; }
.mb8 { margin-bottom: 8px; }

/* ---------------------------------------------------------------- tables */

table.data { width: 100%; border-collapse: collapse; }
table.data th, table.data td { border: 1px solid var(--border); padding: 8px 8px; text-align: left; vertical-align: top; }
table.data th {
  background: var(--panel);
  font-weight: 600;
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}
table.data th.sortable { cursor: pointer; user-select: none; }
table.data th.sortable:hover { background: #f0f0f0; }
table.data tbody tr:hover { background: #f6f8fb; }
table.data tr.clickable { cursor: pointer; }
table.data td.num, table.data th.num { text-align: right; }
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 4px; }
.tablewrap table.data th, .tablewrap table.data td { border-left: none; border-right: none; }

/* ----------------------------------------------------------------- pills */

.pill {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  font-size: 11px;
  border: 1px solid;
  white-space: nowrap;
}
.pill.instock  { color: #444;      border-color: #ccc;    background: #f2f2f2; }
.pill.assigned { color: var(--accent); border-color: #b8cde8; background: #eef4fc; }
.pill.inrepair { color: var(--amber);  border-color: #e6d3a3; background: #fdf6e3; }
.pill.retired, .pill.lost, .pill.returnedtovendor { color: #8a4a44; border-color: #e0c4c1; background: #faf0ef; }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: baseline; }
.dot.ok { background: var(--green); }
.dot.warn { background: #d19100; }
.dot.bad { background: var(--red); }
.dot.none { background: #ccc; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 12px;
  padding: 1px 4px 1px 9px;
  font-size: 11px;
}
.chip button { border: none; background: none; padding: 0 4px; color: var(--muted); cursor: pointer; line-height: 1; }
.chip button:hover { color: var(--red); background: none; }

/* ------------------------------------------------------------ stat cards */

.stat {
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  background: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
  cursor: pointer;
  display: block;
  color: var(--text);
}
.stat:hover { background: #f6f8fb; text-decoration: none; }
.stat .n { font-size: 22px; font-weight: 600; line-height: 1.1; }
.stat .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }

/* --------------------------------------------------------------- CSS bars */

.bar { background: #eee; height: 10px; border-radius: 2px; overflow: hidden; }
.bar > div { background: var(--accent); height: 100%; }
.barrow { display: grid; grid-template-columns: 150px 1fr 90px; gap: 8px; align-items: center; padding: 3px 0; }

/* ---------------------------------------------------------- notification */

#errbar {
  display: none;
  border: 1px solid #e3b3ae;
  background: #fdf1f0;
  color: var(--red);
  padding: 8px 10px;
  border-radius: 4px;
  margin-bottom: 12px;
  white-space: pre-wrap;
}
#errbar.show { display: block; }
#errbar button { float: right; }
#okbar {
  display: none;
  border: 1px solid #bcd9c4;
  background: #f1f8f3;
  color: var(--green);
  padding: 8px 10px;
  border-radius: 4px;
  margin-bottom: 12px;
}
#okbar.show { display: block; }

.loading { color: var(--muted); padding: 10px 0; }

/* --------------------------------------------------------------- modals */

.modal-back {
  position: fixed; inset: 0; background: rgba(0,0,0,.28);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 12px; overflow: auto; z-index: 50;
}
.modal {
  background: #fff; border-radius: 4px; border: 1px solid var(--border);
  box-shadow: 0 1px 2px rgba(0,0,0,.06); width: 640px; max-width: 100%;
}
.modal.wide { width: 880px; }
.modal header { padding: 10px 14px; border-bottom: 1px solid var(--border); font-weight: 600; }
.modal .body { padding: 14px; max-height: 70vh; overflow: auto; }
.modal footer { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.modal .err {
  display: none; border: 1px solid #e3b3ae; background: #fdf1f0; color: var(--red);
  padding: 6px 8px; border-radius: 4px; margin-bottom: 10px; white-space: pre-wrap;
}
.modal .err.show { display: block; }
fieldset { border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; margin: 0 0 12px; }
legend { font-weight: 600; padding: 0 4px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }

/* ----------------------------------------------------------------- tabs */

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.tabs button {
  border: 1px solid transparent; border-bottom: none; background: none;
  border-radius: 4px 4px 0 0; padding: 5px 12px; margin-bottom: -1px; color: var(--muted);
}
.tabs button.active { border-color: var(--border); border-bottom-color: #fff; background: #fff; color: var(--text); font-weight: 600; }

/* ---------------------------------------------------------- definitions */

dl.defs { display: grid; grid-template-columns: 160px 1fr; gap: 4px 12px; margin: 0; }
dl.defs dt { color: var(--muted); }
dl.defs dd { margin: 0; word-break: break-word; }

/* --------------------------------------------------------------- import */

.step { border: 1px solid var(--border); border-radius: 4px; margin-bottom: 12px; }
.step > h2 { padding: 8px 12px; margin: 0; border-bottom: 1px solid var(--border); background: var(--panel); }
.step > .inner { padding: 12px; }
.step.disabled { opacity: .5; pointer-events: none; }
tr.v-create td { background: #f3f9f4; }
tr.v-update td { background: #fdf9ef; }
tr.v-error  td { background: #fdf1f0; }
.summarybar { font-weight: 600; padding: 6px 0; }
.diffline { font-size: 11px; color: var(--muted); }

.noaccess { max-width: 460px; margin: 80px auto; text-align: center; }
</style>
