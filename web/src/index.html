<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <meta name="robots" content="noindex">
  <title>Asset Tracker</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Demo bar — stripped out of the http build. */
    #demobar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      border: 1px solid #e6d3a3;
      background: #fdf6e3;
      color: #a86400;
      border-radius: 4px;
      padding: 6px 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    #demobar select { width: auto; padding: 2px 4px; }
    #demobar .sep { color: #d9c68f; }
    #demobar code { font-family: Consolas, "Courier New", monospace; }
  </style>
</head>
<body>
  <noscript>
    <div style="max-width:520px;margin:80px auto;text-align:center">
      <h1>JavaScript required</h1>
      <p>Asset Tracker is a single-page app and needs JavaScript enabled.</p>
    </div>
  </noscript>

  <div id="app">
    <div id="sidebar">
      <div class="brand">Asset Tracker<small>IT &amp; non-IT asset register</small></div>
      <nav>
        <a href="#/" data-nav="dashboard">Dashboard</a>
        <a href="#/assets" data-nav="assets">Assets</a>
        <a href="#/import" data-nav="import">Import</a>
        <a href="#/masters" data-nav="masters">Masters</a>
        <a href="#/reports" data-nav="reports">Reports</a>
        <a href="#/audit" data-nav="audit">Audit</a>
      </nav>
      <div class="who">
        <span id="whoName"></span><br>
        <span id="whoRole" class="muted"></span><br>
        <a id="sheetLink" href="#" target="_blank" rel="noopener">Open the sheet</a>
        <!--BEGIN HTTP--> · <a href="/api/auth/logout">Sign out</a><!--END HTTP-->
      </div>
    </div>

    <div id="main">
      <!--BEGIN DEMO-->
      <div id="demobar">
        <b>Demo mode</b>
        <span>data lives in this browser only — nothing is shared or sent anywhere</span>
        <span class="sep">|</span>
        <span>signed in as <code id="demoUser"></code></span>
        <span class="sep">|</span>
        <label>Role
          <select id="demoRole">
            <option>Admin</option>
            <option>Editor</option>
            <option>Viewer</option>
          </select>
        </label>
        <button class="small" id="demoReset">Reset demo data</button>
      </div>
      <!--END DEMO-->

      <div id="errbar"></div>
      <div id="okbar"></div>
      <div id="content" class="loading">Loading…</div>
    </div>
  </div>

  <!--BEGIN DEMO-->
  <!-- Apps Script host shim: SpreadsheetApp, Session, Lock/Cache/Properties -->
  <script src="js/host-browser.js"></script>

  <!-- Server logic, byte-identical to /src/*.gs (generated by build.js) -->
  <script src="js/backend/Utils.js"></script>
  <script src="js/backend/Sheets.js"></script>
  <script src="js/backend/Auth.js"></script>
  <script src="js/backend/Audit.js"></script>
  <script src="js/backend/Assets.js"></script>
  <script src="js/backend/Assignments.js"></script>
  <script src="js/backend/Maintenance.js"></script>
  <script src="js/backend/Import.js"></script>
  <script src="js/backend/Export.js"></script>
  <script src="js/backend/Dashboard.js"></script>
  <script src="js/backend/Code.js"></script>
  <!--END DEMO-->

  <!-- Client, generated from /src/ui/*.html -->
  <script src="js/app.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/assets.js"></script>
  <script src="js/pages/asset-detail.js"></script>
  <script src="js/pages/import.js"></script>
  <script src="js/pages/masters.js"></script>
  <script src="js/pages/audit.js"></script>

  <!-- Transport seam + boot -->
  <!--BEGIN DEMO--><script src="js/local-transport.js"></script><!--END DEMO-->
  <!--BEGIN HTTP--><script src="js/http-transport.js"></script><!--END HTTP-->
</body>
</html>
